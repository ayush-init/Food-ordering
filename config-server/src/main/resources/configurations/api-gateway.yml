server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: food-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/foods/**

        - id: order-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**

        - id: payment-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/payments/**

