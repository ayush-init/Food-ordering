server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: food-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/foods/**, /restaurants/**

        - id: order-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**

        - id: payment-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/payments/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
